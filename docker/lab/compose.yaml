name: zetty-uba-file
services:
  uba:
    build:
      context: ../..
      dockerfile: docker/lab/Dockerfile
    image: zetty-uba-file:local
    cpus: 0.5
    mem_limit: 1g
    read_only: true
    network_mode: none
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${ZETTY_LAB_RUN:?set completed trusted HTTP run}
        target: /model
        read_only: true
      - type: bind
        source: ${ZETTY_LAB_INPUT_DIR:?set normalized capture directory}
        target: /input
        read_only: true
      - type: bind
        source: ${ZETTY_LAB_OUTPUT_DIR:?set result directory}
        target: /output
    entrypoint: ["python", "-m", "zetty_uba.lab.http_file"]
    command: ["--capture", "/input", "--run", "/model", "--manifest-sha256", "${ZETTY_LAB_MANIFEST_SHA256:?set pinned study hash}", "--model", "${ZETTY_LAB_MODEL:-if-t100-s512-seed42}", "--output", "/output"]
