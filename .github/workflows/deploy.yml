name: Deploy uba-analyzer to UBA EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-uba
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  UBA_INSTANCE_ID: i-0e06820c477644613

jobs:
  ci:
    name: CI — syntax + import 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: py_compile (전 모듈)
        run: |
          find pipeline.py ingest aggregate scoring storage user_profile.py \
            -name "*.py" -exec python -m py_compile {} +
      - name: dry-import (모듈 그래프 정합)
        run: |
          python - <<'PY'
          from ingest import log_fetcher
          from aggregate import event_aggregator, ip_aggregator
          from scoring import baseline_store, risk_scorer, factor_engine, \
                              token_violation, attacker_level_classifier
          from storage import es_writer
          import user_profile
          print("OK: all modules imported")
          PY

  deploy:
    name: Deploy — SSM git pull on UBA EC2
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: AWS OIDC 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-uba-${{ github.run_id }}

      - name: SSM 배포 (base64 ship → 박스에서 git pull + dev artifact 제거)
        run: |
          cat > /tmp/deploy.sh <<'BASH'
          set -e
          export HOME=/root
          git config --global --add safe.directory /opt/zeti-uba
          cd /opt/zeti-uba
          git fetch origin --quiet
          git reset --hard origin/main
          rm -rf tests legacy docs README.md .github 2>/dev/null || true
          find . -type d -name __pycache__ -not -path "./.venv/*" -exec rm -rf {} + 2>/dev/null || true
          echo "HEAD: $(git log --oneline -1)"
          echo "디렉토리: $(ls -d ingest aggregate scoring storage llm-agent mcp 2>/dev/null | tr '\n' ' ')"
          BASH

          B64=$(base64 -w0 /tmp/deploy.sh)
          cat > /tmp/cmd.json <<JSON
          {
            "commands": [
              "echo $B64 | base64 -d > /tmp/gha-deploy.sh",
              "sh /tmp/gha-deploy.sh"
            ]
          }
          JSON

          CID=$(aws ssm send-command \
            --instance-ids "$UBA_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GHA deploy run ${{ github.run_id }}" \
            --timeout-seconds 180 \
            --parameters file:///tmp/cmd.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CID"

          for i in $(seq 1 36); do
            S=$(aws ssm get-command-invocation --command-id "$CID" \
                --instance-id "$UBA_INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo Pending)
            case "$S" in
              Success) echo "STATUS: $S"; break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM 실패: $S"
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$UBA_INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 5
          done

          echo "==== 배포 결과 ===="
          aws ssm get-command-invocation --command-id "$CID" \
            --instance-id "$UBA_INSTANCE_ID" --query "StandardOutputContent" --output text

      - name: 헬스체크 — 박스에서 모듈 dry-import
        run: |
          cat > /tmp/health.sh <<'BASH'
          /opt/zeti-uba/.venv/bin/python - <<PY
          import sys
          sys.path.insert(0, "/opt/zeti-uba")
          from ingest import log_fetcher
          from aggregate import event_aggregator, ip_aggregator
          from scoring import baseline_store, risk_scorer, factor_engine
          from storage import es_writer
          import user_profile
          print("OK: 박스 모듈 dry-import 성공")
          PY
          BASH
          B64=$(base64 -w0 /tmp/health.sh)
          cat > /tmp/health.json <<JSON
          {"commands":["echo $B64 | base64 -d > /tmp/gha-health.sh","sh /tmp/gha-health.sh"]}
          JSON
          CID=$(aws ssm send-command \
            --instance-ids "$UBA_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 30 \
            --parameters file:///tmp/health.json \
            --query "Command.CommandId" --output text)
          sleep 8
          aws ssm get-command-invocation --command-id "$CID" \
            --instance-id "$UBA_INSTANCE_ID" --query "StandardOutputContent" --output text
